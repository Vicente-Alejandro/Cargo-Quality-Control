[package]
name = "cargo-qc"
version = "0.7.0"
rust-version = "1.85"
edition = "2024"
description = "A custom cargo command for quality control (fmt, clippy, test etc)"
exclude = [
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "cliff.toml",
    "ROADMAP.md",
    ".github/",
    ".agents/",
]
authors = ["Vicente Alejandro <alejandrohidalgosh@email.com>"]
license = "MIT"
repository = "https://github.com/Vicente-Alejandro/Cargo-Quality-Control"
documentation = "https://docs.rs/cargo-qc"
readme = "README.md"
keywords = ["cli", "cargo-subcommand", "quality-control", "automation"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

exclude = [
    "/.agents",
    "/.github",
    "ROADMAP.md",
    "develop.t",
    "test_server.py",
    "/tools/",
    "CHANGELOG.md"
]

[dependencies]
# Lightweight ANSI colouring — zero transitive dependencies
owo-colors = "4"
# Date/time formatting — minimal features only, no wasm-bindgen / js-sys
time = { version = "0.3", default-features = false, features = ["local-offset"] }
# Application-layer error context (zero deps)
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
